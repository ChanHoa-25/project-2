<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/filepond@^4/dist/filepond.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link href="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.css" rel="stylesheet">
    <script src="https://cdn.tiny.cloud/1/hku7rvodxa944kf9ejogsbou40e6i8zb7j1nbnd8iqmfz4gx/tinymce/8/tinymce.min.js" referrerpolicy="origin" crossorigin="anonymous"></script>
    <script src="assets/js/tinymce-config.js"></script>
    <title>Thông tin website </title>
  </head>
  <body>
    <!--Header-->
    <!-- Header-->
    <header class="header">
      <div class="inner-logo"><a href="#"><span>28</span><span>Admin</span></a></div>
      <div class="inner-wrap">
        <div class="inner-notify"><img src="assets/images/icon.svg" alt=""><span>6</span></div>
        <div class="inner-account">
          <div class="inner-avata"><img src="assets/images/avata.png" alt=""></div>
          <div class="inner-text">
            <div class="inner-name">Le Van A</div>
            <div class="inner-role">Admin</div>
          </div>
        </div>
        <button class="inner-button-menu">
           <i class="fa-solid fa-bars"></i></button>
      </div>
    </header>
    <!-- End header-->
    <!--End header-->
    <!-- Sider-->
    <nav class="sider">
      <ul class="inner-menu"> 
        <li><a class="active" href="#"><i class="fa-solid fa-gauge-high"></i> Tổng quan </a></li>
        <li><a href="#"><i class="fa-solid fa-table-cells-large"></i> Quản lý danh mục </a></li>
        <li><a href="#"><i class="fa-solid fa-table-list"></i> Quản lý tour</a></li>
        <li><a href="#"><i class="fa-solid fa-list-check"></i> Quản lý đơn hàng</a></li>
        <li><a href="#"><i class="fa-regular fa-user"></i> Quản lý người dùng</a></li>
        <li><a href="#"><i class="fa-solid fa-user-group"></i> Thông tin liên hệ</a></li>
      </ul>
      <hr>
      <ul class="inner-menu"> 
        <li> <a href="#"><i class="fa-solid fa-gear"></i> Cài đặt chung </a></li>
        <li> <a href="#"><i class="fa-solid fa-user-gear"></i>  Thông tin cá nhân</a></li>
        <li><a class="inner-logout" href="#"><i class="fa fa-power-off"></i> Đăng xuất</a></li>
      </ul>
    </nav>
    <div class="sider-overlay"> </div>
    <!-- End Sider-->
    <!-- Main-->
    <main class="main">
      <h1 class="box-title">Thông tin webstie</h1>
      <!--Section-8-->
      <div class="section-8"> 
        <form class="inner-form" action=""> 
          <div class="inner-group"> 
            <label class="inner-label" for="websitename">Tên website</label>
            <input type="text" id="websitename" value="28.TRAVEL">
          </div>
          <div class="inner-group"> 
            <label class="inner-label" for="phone">Số điện thoại</label>
            <input type="number" id="phone" value="0123456789">
          </div>
          <div class="inner-group"> 
            <label class="inner-label" for="email">Email</label>
            <input type="email" id="email" value="contact@28travel.com">
          </div>
          <div class="inner-group"> 
            <label class="inner-label" for="address">Địa chỉ</label>
            <input type="text" id="address" value="Số 123, đường ABC">
          </div>
          <div class="inner-group"> 
            <label class="inner-label" for="logo">Logo</label>
            <div class="inner-upload-image" accept="image/*">
              <input type="file" id="logo" filepond-image>
            </div>
          </div>
          <div class="inner-group"> 
            <label class="inner-label" for="favicon">Favicon</label>
            <div class="inner-upload-image">
              <input type="file" id="favicon" accept="image/*" filepond-image>
            </div>
          </div>
          <div class="inner-button inner-two-col"> 
            <button>Cập nhật</button>
          </div>
        </form>
        <div class="inner-back"> <a href="#">Quay lại danh sách</a></div>
      </div>
      <!--End Section-8-->
    </main>
    <!-- End Main-->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.js"> </script>
    <script src="https://unpkg.com/filepond-plugin-file-validate-type/dist/filepond-plugin-file-validate-type.js"> </script>
    <script src="https://unpkg.com/filepond@^4/dist/filepond.js"> </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
    <script src="assets/js/scripts.js"> </script>
  </body>
</html>
