<!DOCTYPE html >
<html>
  <head> 
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="assets/css/style.css"/>
    <title>Đăng nhập</title>
    <div class="page-account">
      <div class="form-account"> 
        <h2 class="inner-title">Đăng nhập </h2>
        <p class="inner-desc">Vui lòng nhập email và mật khẩu để tiếp tục</p>
        <form class="inner-form">
          <div class="inner-group"> 
            <label class="inner-label" for="email">Email </label>
            <input class="inner-control" type="email" name="" id="email" placeholder="Ví dụ: levana@gmail.com"/>
          </div>
          <div class="inner-group"> 
            <label class="inner-label" for="passowrd">Mật khẩu </label>
            <input class="inner-control" type="password" name="" id="password"/>
          </div>
          <div class="inner-meta">
            <div class="inner-confirm"> 
              <input class="inner-check" type="checkbox" name="" id="remember-password"/>
              <label class="inner-label" for="remember-password">Nhớ mật khẩu</label>
            </div><a class="inner-forgot-password" href="#">Quên mật khẩu</a>
          </div>
          <button class="inner-button">Đăng nhập</button>
        </form>
        <div class="inner-more"> <span>Bạn chưa có tài khoản </span><a href="#">Tạo tài khoản</a></div>
      </div>
    </div>
  </head>
  <body> 
    <div class="page-account">
    </div>
  </body>
</html>
