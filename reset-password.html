    <title>Đổi mật khẩu</title>

        <form class="inner-form">
          <div class="inner-group"> 
            <label class="inner-label" for="passowrd">Mật khẩu mới</label>
            <input class="inner-control" type="password" name="" id="password"/>
          </div>
          <div class="inner-group"> 
            <label class="inner-label" for="confirm-passowrd">Xác nhận mật khẩu </label>
            <input class="inner-control" type="password" name="" id="confirm-password"/>
          </div>
          <button class="inner-button">Thay đổi</button>
        </form>
        <div class="inner-more"> <span>Bạn đã nhớ mật khẩu?</span><a href="#">Đăng nhập</a></div>
      </div>
    </div>
