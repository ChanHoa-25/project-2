<!DOCTYPE html >
<html>
  <head> 
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="assets/css/style.css"/>
    <title>Nhập mã OTP</title>
  </head>
  <body> 
    <div class="page-account">
      <div class="form-account"> 
        <h2 class="inner-title">Nhập mã OTP</h2>
        <p class="inner-desc">Vui lòng nhập mã OTP để tiếp tục</p>
        <form class="inner-form" id="otp-password-form">
          <div class="inner-group"> 
            <label class="inner-label" for="otp">Mã OTP</label>
            <input class="inner-control" type="text" name="otp" id="otp" placeholder="Ví dụ: Ví dụ: 123456"/>
          </div>
          <button class="inner-button">Xác thực</button>
        </form>
        <div class="inner-more"> <span>Bạn đã nhớ mật khẩu </span><a href="#">Đăng nhập</a></div>
      </div>
    </div>
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
    <script src="assets/js/account.js"> </script>
  </body>
</html>
