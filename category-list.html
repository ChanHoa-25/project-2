<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Quản lý danh mục</title>
  </head>
  <body>
    <!--Header-->
    <!-- Header-->
    <header class="header">
      <div class="inner-logo"><a href="#"><span>28</span><span>Admin</span></a></div>
      <div class="inner-wrap">
        <div class="inner-notify"><img src="assets/images/icon.svg" alt=""><span>6</span></div>
        <div class="inner-account">
          <div class="inner-avata"><img src="assets/images/avata.png" alt=""></div>
          <div class="inner-text">
            <div class="inner-name">Le Van A</div>
            <div class="inner-role">Admin</div>
          </div>
        </div>
        <button class="inner-button-menu">
           <i class="fa-solid fa-bars"></i></button>
      </div>
    </header>
    <!-- End header-->
    <!--End header-->
    <!-- Sider-->
    <nav class="sider">
      <ul class="inner-menu"> 
        <li><a class="active" href="#"><i class="fa-solid fa-gauge-high"></i> Tổng quan </a></li>
        <li><a href="#"><i class="fa-solid fa-table-cells-large"></i> Quản lý danh mục </a></li>
        <li><a href="#"><i class="fa-solid fa-table-list"></i> Quản lý tour</a></li>
        <li><a href="#"><i class="fa-solid fa-list-check"></i> Quản lý đơn hàng</a></li>
        <li><a href="#"><i class="fa-regular fa-user"></i> Quản lý người dùng</a></li>
        <li><a href="#"><i class="fa-solid fa-user-group"></i> Thông tin liên hệ</a></li>
      </ul>
      <hr>
      <ul class="inner-menu"> 
        <li> <a href="#"><i class="fa-solid fa-gear"></i> Cài đặt chung </a></li>
        <li> <a href="#"><i class="fa-solid fa-user-gear"></i>  Thông tin cá nhân</a></li>
        <li><a class="inner-logout" href="#"><i class="fa fa-power-off"></i> Đăng xuất</a></li>
      </ul>
    </nav>
    <!-- End Sider-->
    <!-- Main-->
    <main class="main">
      <h1 class="box-title">Quản lý danh mục</h1>
      <!--Section-4-->
      <div class="section-4"> 
        <div class="inner-wrap"> 
          <div class="inner-item"> 
            <div class="inner-label">
               <i class="fa-solid fa-filter"></i> Bộ lọc</div>
          </div>
          <div class="inner-item"> 
            <select>
              <option value="">Trạng thái  </option>
              <option value="">Hoạt động </option>
              <option value="">Tạm dừng</option>
            </select>
          </div>
          <div class="inner-item"> 
            <select>
              <option value="">Người tạo  </option>
              <option value="">Lê Văn A</option>
              <option value="">Lê Văn B</option>
            </select>
          </div>
          <div class="inner-item"> 
            <div class="inner-date"> 
              <input type="date"><span>-</span>
              <input type="date">
            </div>
          </div>
          <div class="inner-item"> 
            <div class="inner-reset"><i class="fa-solid fa-rotate-left"></i> Xóa bộ lọc</div>
          </div>
        </div>
      </div>
      <!--End Section-4-->
      <!--Section-5-->
      <div class="section-5"> 
        <div class="inner-wrap"> 
          <div class="inner-change-status"> 
            <div class="inner-item"> 
              <select> 
                <option value="">-- Hành động --</option>
                <option value="">Hoạt động </option>
                <option value="">Dừng hoạt động</option>
                <option value="">Xóa</option>
              </select>
            </div>
            <div class="inner-item"> 
              <button>Áp dụng </button>
            </div>
          </div>
          <div class="inner-search">
             <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Tìm kiếm">
          </div>
          <div class="inner-button-create"> 
            <button>+ Tạo mới</button>
          </div>
        </div>
      </div>
      <!--End Section-5-->
    </main>
    <!-- End Main-->
  </body>
</html>
