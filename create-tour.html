<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Tạo tour</title>
  </head>
  <body>
    <!--Header-->
    <!-- Header-->
    <header class="header">
      <div class="inner-logo"><a href="#"><span>28</span><span>Admin</span></a></div>
      <div class="inner-wrap">
        <div class="inner-notify"><img src="assets/images/icon.svg" alt=""><span>6</span></div>
        <div class="inner-account">
          <div class="inner-avata"><img src="assets/images/avata.png" alt=""></div>
          <div class="inner-text">
            <div class="inner-name">Le Van A</div>
            <div class="inner-role">Admin</div>
          </div>
        </div>
        <button class="inner-button-menu">
           <i class="fa-solid fa-bars"></i></button>
      </div>
    </header>
    <!-- End header-->
    <!--End header-->
    <!-- Sider-->
    <nav class="sider">
      <ul class="inner-menu"> 
        <li><a class="active" href="#"><i class="fa-solid fa-gauge-high"></i> Tổng quan </a></li>
        <li><a href="#"><i class="fa-solid fa-table-cells-large"></i> Quản lý danh mục </a></li>
        <li><a href="#"><i class="fa-solid fa-table-list"></i> Quản lý tour</a></li>
        <li><a href="#"><i class="fa-solid fa-list-check"></i> Quản lý đơn hàng</a></li>
        <li><a href="#"><i class="fa-regular fa-user"></i> Quản lý người dùng</a></li>
        <li><a href="#"><i class="fa-solid fa-user-group"></i> Thông tin liên hệ</a></li>
      </ul>
      <hr>
      <ul class="inner-menu"> 
        <li> <a href="#"><i class="fa-solid fa-gear"></i> Cài đặt chung </a></li>
        <li> <a href="#"><i class="fa-solid fa-user-gear"></i>  Thông tin cá nhân</a></li>
        <li><a class="inner-logout" href="#"><i class="fa fa-power-off"></i> Đăng xuất</a></li>
      </ul>
    </nav>
    <!-- End Sider-->
    <!-- Main-->
    <main class="main">
      <h1 class="box-title">Tạo tour</h1>
      <!--Section-8-->
      <div class="section-8"> 
        <form class="inner-form" action=""> 
          <div class="inner-group"> 
            <label for="name" clas="inner-label">Tên tour</label>
            <input type="text" id="name">
          </div>
          <div class="inner-group"> 
            <label for="category" clas="inner-label">Danh mục</label>
            <select id="parent"> 
              <option value="">-- Chọn danh mục --</option>
              <option value="">Danh mục 1</option>
              <option value="">Danh mục 2</option>
            </select>
          </div>
          <div class="inner-group"> 
            <label for="postion" clas="inner-label">Vị trí</label>
            <input type="number" id="position">
          </div>
          <div class="inner-group"> 
            <label for="status" clas="inner-label">Trạng thái</label>
            <select id="status"> 
              <option value="">Hoạt động</option>
              <option value="">Dừng hoạt động</option>
            </select>
          </div>
          <div class="inner-group inner-two-col">
            <label for="avata" clas="inner-label">Ảnh đại diện</label>
            <div class="inner-upload-image"> 
              <input type="file" id="avata" accept="image/*">
            </div>
          </div>
          <div class="inner-group"> 
            <label clas="inner-label">Giá cũ</label>
            <div class="inner-input-list"> 
              <div class="inner-input-item"> 
                <label>Người lớn </label>
                <input type="number">
              </div>
              <div class="inner-input-item"> 
                <label>Trẻ em</label>
                <input type="number">
              </div>
              <div class="inner-input-item"> 
                <label>Em bé</label>
                <input type="number">
              </div>
            </div>
          </div>
          <div class="inner-group"> 
            <label clas="inner-label">Giá mới</label>
            <div class="inner-input-list"> 
              <div class="inner-input-item"> 
                <label>Người lớn </label>
                <input type="number">
              </div>
              <div class="inner-input-item"> 
                <label>Trẻ em</label>
                <input type="number">
              </div>
              <div class="inner-input-item"> 
                <label>Em bé</label>
                <input type="number">
              </div>
            </div>
          </div>
          <div class="inner-group"> 
            <label clas="inner-label">Còn lại</label>
            <div class="inner-input-list"> 
              <div class="inner-input-item"> 
                <label>Người lớn </label>
                <input type="number">
              </div>
              <div class="inner-input-item"> 
                <label>Trẻ em</label>
                <input type="number">
              </div>
              <div class="inner-input-item"> 
                <label>Em bé</label>
                <input type="number">
              </div>
            </div>
          </div>
          <div class="inner-group"> 
            <label clas="inner-label">Những địa điểm có tour</label>
            <div class="inner-checkbox-list"> 
              <div class="inner-checkbox-item"> 
                <input type="checkbox">
                <label>Hà Nội</label>
              </div>
              <div class="inner-checkbox-item"> 
                <input type="checkbox">
                <label>Đà Nẵng</label>
              </div>
              <div class="inner-checkbox-item"> 
                <input type="checkbox">
                <label>Nha Trang</label>
              </div>
              <div class="inner-checkbox-item"> 
                <input type="checkbox">
                <label>Hồ Chí Minh</label>
              </div>
            </div>
          </div>
          <div class="inner-group"> 
            <label for="time" clas="inner-label">Thời gian</label>
            <input type="text" id="time">
          </div>
          <div class="inner-group"> 
            <label for="vehicle" clas="inner-label">Phương tiện</label>
            <input type="text" id="vehicel">
          </div>
          <div class="inner-group"> 
            <label for="departureDate" clas="inner-label">Ngày khởi hành</label>
            <input type="date" id="departureDate">
          </div>
          <div class="inner-group inner-two-col"> 
            <label for="information" clas="inner-label">Thông tin tour</label>
            <textarea id="information"> </textarea>
          </div>
          <div class="inner-group inner-two-col"> 
            <label clas="inner-label">Lịch trình tour
              <div class="inner-schedule"> 
                <div class="inner-schedule-list">
                  <div class="inner-schedule-item"> 
                    <div class="inner-schedule-head"><span class="inner-schedule-button inner-move"><i class="fa-solid fa-arrows-up-down-left-right"></i></span>
                      <input type="text"><span class="inner-schedule-button inner-remove"><i class="fa-solid fa-trash-can"></i></span><span class="inner-schedule-button inner-more"><i class="fa-solid fa-angle-down"></i></span>
                    </div>
                    <div class="inner-shedule-body">
                      <textarea name=""> </textarea>
                    </div>
                  </div>
                </div>
                <div class="inner-schedule-create">+ Thêm lịch trình</div>
              </div>
            </label>
          </div>
          <div class="inner-button inner-two-col"> 
            <button>Tạo mới</button>
          </div>
        </form>
        <div class="inner-back"> <a href="#">Quay lại danh sách</a></div>
      </div>
      <!--End Section-8-->
    </main>
    <!-- End Main-->
  </body>
</html>
